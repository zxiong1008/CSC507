apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-lab
  namespace: unix-lab
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: ubuntu-lab
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ubuntu-lab-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: ubuntu-lab-cloudinit
            networkDataSecretRef:
              name: ubuntu-lab-cloudinit
